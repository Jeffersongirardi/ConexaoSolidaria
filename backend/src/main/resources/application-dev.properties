# H2 in-memory for development
spring.datasource.url=jdbc:h2:mem:conexoessolidarias;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA + Flyway (schema gerenciado por migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (segredo de desenvolvimento — NÃO usar em produção)
app.jwt.secret=desenvolvimento-conexoes-solidarias-segredo-local-com-32-chars+
app.jwt.access-minutes=60
app.jwt.refresh-days=7

# Frontend local (links de e-mail + CORS)
app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# Uploads locais
app.upload.dir=./uploads

# Server
server.port=8080
