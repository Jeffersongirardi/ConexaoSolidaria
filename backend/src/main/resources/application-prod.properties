# MySQL na Railway (RailwayDataSourceConfig converte DATABASE_URL/MYSQL_*).
# Banco NOVO (sem migração de dados do H2/Render): Flyway aplica o baseline
# MySQL único em db/migration/mysql (NÃO portar V1–V7 do H2: usam sintaxe
# Postgres — IDENTITY, RENAME COLUMN/CONSTRAINT, IF NOT EXISTS).
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA + Flyway (baseline MySQL próprio — banco novo, sem dados legados)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-mysql

# Atrás do proxy da Railway: sem isso o RateLimitFilter enxerga 1 IP só e bloqueia todo mundo
server.forward-headers-strategy=native

# JWT (segredo via variável de ambiente)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=60
app.jwt.refresh-days=7

# Frontend em produção (links de e-mail + CORS) — https, sem / no fim
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_URL}

# Remetente verificado no Resend (domínio precisa estar Verified — Guia 3)
app.mail.from=${MAIL_FROM:contato@conexaosolidarias.com.br}

# Uploads: disco local é fallback/dev — em prod usar R2 (R2StorageService, Fase 3)
app.upload.dir=${UPLOAD_DIR:./uploads}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Mail legado (SMTP): em desuso após Resend (Fase 3) — mantido só como fallback
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}
server.error.include-stacktrace=never
