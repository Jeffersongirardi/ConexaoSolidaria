# PostgreSQL for production (DATABASE_URL convertido em RenderDataSourceConfig)
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (segredo via variável de ambiente)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=60
app.jwt.refresh-days=7

# Frontend em produção (links de e-mail + CORS)
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_URL}

# Uploads (fase atual: disco local; futura: storage externo)
app.upload.dir=${UPLOAD_DIR:./uploads}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}
server.error.include-stacktrace=never
